# Dev-Dashboard (devdash) settings. Copy to ~/.config/devdash/config.toml (or $XDG_CONFIG_HOME/devdash/config.toml),
# or point --config / $DEVDASH_CONFIG at any path. Every key is optional; the values below are the defaults.
# Command-line flags override this file.

# Seconds between refreshes.
interval = 60

[github]
# Repositories to hide from both PR sections. An entry is "owner/repo" for one repository,
# or a bare "owner" for every repository of that user or organization.
#   exclude = ["my-org/monorepo", "some-other-org"]
exclude = []

# Show the REVIEW REQUESTED section.
review_requested = true

# GitHub username from `gh auth status` (`--github`). Empty uses gh's active account.
# account = "alice"
account = ""

[usage]
# The USAGE section reads `omp usage`. "auto" shows it only when `omp` is on PATH.
enabled = "auto"  # true | false | "auto"

# Force a fresh usage read when the cached one is older than this many seconds. 0 = never force.
refetch_after = 180

# Show a pace icon on weekly and monthly bars: > >> >>> too fast, < << <<< too slow, | on pace.
pace = true

# Providers listed here come first, in this order; the rest follow in the built-in order.
order = []  # e.g. ["openai-codex", "anthropic"]

# Display names and heading colours per omp provider id.
[usage.names]
# anthropic = "Claude"

[usage.colors]
# anthropic = "#d97757"

# Custom integrations: your own sections. Add one [[integrations]] table per section, as many as you like.
# devdash runs `command` (a list, run without a shell) and shows what it prints. See README "Custom integrations".
# [[integrations]]
# name = "weather"            # required, unique; `--no-integration weather` hides it
# title = "WEATHER"           # heading; default: the name in capitals
# command = ["curl", "-fsS", "https://wttr.in/?format=3"]
# position = "bottom"         # "top" | "after-usage" | "after-my-prs" | "bottom"
# interval = 0                # seconds between runs; 0 = the global interval
# timeout = 10                # seconds before the command and its children are killed
# max_rows = 20               # longer output is cut
# enabled = true
# env = {}                    # extra environment variables, e.g. { CITY = "Toronto" }
