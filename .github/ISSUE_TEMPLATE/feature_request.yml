name: Feature request
description: Suggest something devdash should show or do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like devdash to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
